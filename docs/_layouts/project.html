<!doctype html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  {% include topbar.html %}

  <main id="main">
    {% include hero.html %}
    {% include teaser.html %}

    <div class="prose">
      {{ content }}
    </div>

    {% include bibtex.html %}
  </main>

  {% include footer.html %}

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Close image viewer">{% include icon.html name="close" %}</button>
    <img class="lightbox__img" id="lightbox-img" alt="">
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
